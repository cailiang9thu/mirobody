# mirobody-rare: the rare-disease coding layer (阶段一 MVP, docs/rare-mvp-plan.md §2).
#
#     uv pip install -e plugins/mirobody-rare
#
# A separate distribution on purpose: the main `mirobody` wheel stays numpy-only,
# and everything here (HPO / Orphanet / HGNC tables, the coding shim) registers
# through the `mirobody.tools` entry point the same way `examples/` does.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirobody-rare"
version = "0.1.0"
description = "Rare-disease phenotype (HPO) / disease (ORPHA) / gene (HGNC) coding for mirobody"
requires-python = ">=3.12"
dependencies = ["mirobody", "pyyaml", "numpy", "pydicom", "asyncpg", "tqdm"]

[project.optional-dependencies]
llm = ["google-genai", "tenacity", "tqdm"]
test = ["pytest"]

[project.entry-points."mirobody.tools"]
rare = "mirobody_rare.tools"

[project.entry-points."mirobody.file_handlers"]
rare = "mirobody_rare.handlers"

[project.entry-points."mirobody.routers"]
rare = "mirobody_rare.web"

[project.entry-points."mirobody.text_hooks"]
rare = "mirobody_rare.text_hook"

[project.entry-points."mirobody.delete_hooks"]
rare = "mirobody_rare.erase"

[project.scripts]
mirobody-rare-serve = "mirobody_rare.serve_coding:main"
mirobody-rare-load-reference = "mirobody_rare.reference.load:main"

[tool.setuptools.packages.find]
include = ["mirobody_rare*"]

[tool.setuptools.package-data]
mirobody_rare = ["config.yaml", "res/*.tsv", "res/cues/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: needs a running deployment (MIROBODY_RARE_E2E_BASE)", "web: Playwright against a running web + API deployment (MIROBODY_RARE_WEB_BASE)"]
